          PM_OUT: pm-v029-evidence-control
          TARGET: control
          PM_APK: ${{ github.workspace }}/verification/runtime/control/paper-moon-v0.2.8-release.apk
          MOCK_APK: ${{ github.workspace }}/mock-src/app/build/outputs/apk/debug/app-debug.apk
